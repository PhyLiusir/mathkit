name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sympy==1.14.0" "symengine>=0.14" numpy

      - name: Show version info
        run: |
          python -c "import sys, sympy, symengine; print(sys.version); print('sympy', sympy.__version__, '| symengine', symengine.__version__)"

      - name: CLI help works
        run: python scripts/mathkit.py --help

      - name: Self-check
        env:
          MATHKIT_NO_CORE: "1"
        run: python scripts/selfcheck.py

      - name: Dirac matrix-level verification
        env:
          MATHKIT_NO_CORE: "1"
        run: python scripts/verify_dirac.py

      - name: Documentation number audit
        env:
          MATHKIT_NO_CORE: "1"
        run: python scripts/audit_docs.py
